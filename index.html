<!DOCTYPE html>
<html>
<head>
<title>Madhus Home Bakery</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {margin:0;font-family:Arial;background:#fff;}
header {
  background:#ff4d6d;
  color:white;
  padding:15px;
  text-align:center;
}
nav {
  background:#333;
  padding:10px;
  text-align:center;
}
nav a {
  color:white;
  margin:10px;
  text-decoration:none;
}
.banner {
  background:url('https://images.unsplash.com/photo-1608198093002-ad4e005484ec') center/cover;
  height:250px;
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
  font-size:28px;
  font-weight:bold;
}
.products {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:15px;
  padding:20px;
}
.card {
  background:#fff;
  border-radius:10px;
  box-shadow:0 0 10px #ccc;
  text-align:center;
  padding:10px;
}
.card img {
  width:100%;
  height:180px;
  border-radius:10px;
}
.price {color:green;font-weight:bold;}
button {
  background:#ff4d6d;
  color:white;
  padding:8px;
  border:none;
  border-radius:5px;
}
.footer {
  background:#333;
  color:white;
  text-align:center;
  padding:15px;
}
</style>
</head>

<body>

<header>
<h1>Madhus Home Bakery</h1>
<p>Fresh Cakes, Cookies & Sweets 🍰</p>
</header>

<nav>
<a href="#">Home</a>
<a href="#">Cakes</a>
<a href="#">Cookies</a>
<a href="#">Brownies</a>
<a href="#">Contact</a>
</nav>

<div class="banner">
Order Fresh Homemade Cakes 🎂
</div>

<div class="products">

<div class="card">
<img src="https://images.unsplash.com/photo-1599785209707-28b2c1c1a7d7">
<h3>Chocolate Cake</h3>
<p class="price">₹500</p>
<button>Order</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1588196749597-9ff075ee6b5b">
<h3>Cookies</h3>
<p class="price">₹200</p>
<button>Order</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1606312619070-d48b4c652a52">
<h3>Brownies</h3>
<p class="price">₹300</p>
<button>Order</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1541599540903-216a46ca1dc0">
<h3>Donuts</h3>
<p class="price">₹250</p>
<button>Order</button>
</div>

</div>

<div class="footer">
📞 9347698049 | 📍 Kalidindi  
<br><br>
<button onclick="window.location.href='https://wa.me/919347698049'">
Order on WhatsApp
</button>
</div>

</body>
</html>
