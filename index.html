<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Madhus Home Bakery</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#fff8f0;
color:#333;
}

header{
background:#8B4513;
color:#fff;
padding:20px;
text-align:center;
position:sticky;
top:0;
z-index:1000;
}

header h1{
font-size:36px;
}

header p{
margin-top:8px;
}

nav{
margin-top:15px;
}

nav a{
color:#fff;
text-decoration:none;
margin:0 10px;
font-weight:600;
}

.hero{
height:400px;
background:url("https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=1200") center/cover;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
}

.hero-content{
background:rgba(0,0,0,.55);
padding:25px;
border-radius:12px;
color:#fff;
}

.hero-content h2{
font-size:40px;
margin-bottom:10px;
}

.hero-content p{
font-size:18px;
}

.btn{
display:inline-block;
margin-top:20px;
text-decoration:none
background:#25D366;
color:#fff;
padding:12px 24px;
border-radius:30px;

font-weight:bold;
}
  
  .products{
  padding:40px 20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
}

.card{
  background:#fff;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 5px 15px rgba(0,0,0,.15);
  transition:.3s;
  text-align:center;
}

.card:hover{
  transform:translateY(-5px);
}

.card img{
  width:100%;
  height:220px;
  object-fit:cover;
}

.card h3{
  margin:15px 0;
}

.card p{
  font-size:20px;
  color:#8B4513;
  font-weight:bold;
}

footer{
  background:#8B4513;
  color:white;
  text-align:center;
  padding:20px;
  margin-top:40px;
}
}</style>
</head>

<body>

<header>
  <h1>🍰 Madhus Home Bakery</h1>
  <p>Fresh • Homemade • Delicious</p>

  <nav>
    <a href="#cakes">Cakes</a>
    <a href="#cookies">Cookies</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<section class="hero">
  <div class="hero-content">
    <h2>Welcome to Madhus Home Bakery ❤️</h2>
    <p>Fresh Cakes, Cookies, Chocolates & More</p>

    <a class="btn"
       href="https://wa.me/919347698049"
       target="_blank">
       Order on WhatsApp
    </a>
  </div>
</section>

<section class="products" id="cakes">
<h2 style="text-align:center;color:#8B4513;margin:30px 0;">
🎂 Our Cakes
</h2>

<div class="grid">

<div class="card">
<img src="https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=600">
<h3>Chocolate Cake</h3>
<p>₹600</p>
<a class="btn" href="https://wa.me/919347698049">Order</a>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1563729784474-d77dbb933a9e?w=600">
<h3>Butterscotch Cake</h3>
<p>₹650</p>
<a class="btn" href="https://wa.me/919347698049">Order</a>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1464306076886-da185f6a9d05?w=600">
<h3>Red Velvet Cake</h3>
<p>₹700</p>
<a class="btn" href="https://wa.me/919347698049">Order</a>
</div>

</div>
</section>
