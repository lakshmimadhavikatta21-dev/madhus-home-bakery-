<!DOCTYPE html>
<html>
<head>
<title>Madhus Home Bakery</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {margin:0;font-family:Arial;background:#f8f8f8;}

header {
  background:#ff4d6d;
  color:white;
  padding:15px;
  text-align:center;
}

nav {
  background:#333;
  padding:10px;
  text-align:center;
}

nav a {
  color:white;
  margin:10px;
  text-decoration:none;
  font-weight:bold;
}

.banner {
  background:url('https://images.unsplash.com/photo-1608198093002-ad4e005484ec') center/cover;
  height:250px;
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
  font-size:28px;
  font-weight:bold;
}

.products {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:15px;
  padding:20px;
}

.card {
  background:white;
  border-radius:10px;
  box-shadow:0 0 10px #ccc;
  text-align:center;
  padding:10px;
  transition:0.3s;
}

.card:hover {
  transform:scale(1.05);
}

.card img {
  width:100%;
  height:180px;
  border-radius:10px;
  object-fit:cover;
}

.price {
  color:green;
  font-weight:bold;
}

button {
  background:#ff4d6d;
  color:white;
  padding:8px;
  border:none;
  border-radius:5px;
  cursor:pointer;
}

button:hover {
  background:#e6004c;
}

.footer {
  background:#333;
  color:white;
  text-align:center;
  padding:15px;
}
</style>
</head>

<body>

<header>

</header>

</nav>

</html>
